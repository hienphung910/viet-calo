{% extends "base.html" %}
{% block title %}Đăng nhập · VietCalo{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-6">
  <h1 class="mb-4 type-h1">Đăng nhập</h1>
  <form method="post">{% csrf_token %}
    {% include "_form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-full">Đăng nhập</button>
  </form>
  <p class="mt-4 text-sm">Chưa có tài khoản? <a class="text-brand-600 hover:underline" href="{% url 'accounts:register' %}">Đăng ký</a></p>
</div>
{% endblock %}
