{% extends "base.html" %}
{% block title %}Đăng ký · VietCalo{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-6">
  <h1 class="mb-4 type-h1">Tạo tài khoản</h1>
  <form method="post">{% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary w-full">Đăng ký</button>
  </form>
  <p class="mt-4 text-sm">Đã có tài khoản? <a class="text-brand-600 hover:underline" href="{% url 'accounts:login' %}">Đăng nhập</a></p>
</div>
{% endblock %}
