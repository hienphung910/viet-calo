{% extends "base.html" %}
{% block title %}Đổi mật khẩu · VietCalo{% endblock %}
{% block content %}
<div class="mx-auto max-w-md card p-6">
  <h1 class="mb-4 type-h1">Đổi mật khẩu</h1>
  {% if forced %}
    <div class="mb-4 rounded-xl bg-red-50 px-4 py-3 type-small text-danger">
      Mật khẩu hiện tại của bạn quá yếu. Hãy đặt mật khẩu mới để tiếp tục dùng VietCalo.
    </div>
  {% endif %}
  <form method="post">{% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary w-full">Đổi mật khẩu</button>
  </form>
</div>
{% endblock %}
